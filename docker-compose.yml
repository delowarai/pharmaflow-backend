services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharmaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmaflow123}
      POSTGRES_DB: ${POSTGRES_DB:-pharmaflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharmaflow}:${POSTGRES_PASSWORD:-pharmaflow123}@db:5432/${POSTGRES_DB:-pharmaflow}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
